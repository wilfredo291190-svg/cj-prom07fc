name: CI Alpha Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Verificar Integridad de Archivos JSON
      run: |
        node -e "JSON.parse(require('fs').readFileSync('content/partidos.json', 'utf8'))"
        node -e "JSON.parse(require('fs').readFileSync('content/posiciones.json', 'utf8'))"
        echo "JSONs validados correctamente."
